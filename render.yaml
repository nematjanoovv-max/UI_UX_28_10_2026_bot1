services:
  - type: web
    name: word-converter-bot-2810
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONUNBUFFERED
        value: "1"
